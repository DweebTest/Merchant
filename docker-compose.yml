# Single-machine setup: MySQL and the web app side by side.
#   cp .env.example .env   (fill in SECRET_KEY, DB_PASSWORD, MYSQL_ROOT_PASSWORD)
#   docker compose up -d --build
#   docker compose exec app flask create-admin
# Then open http://localhost:8000
#
# To split later, run only the "db" service (or any MySQL 8) on the database
# server, and point DB_HOST in the app server's .env at it.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-merchant}
      MYSQL_USER: ${DB_USER:-merchant}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      UPLOAD_FOLDER: /data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Attachments folder. On one machine it sits next to the database volume.
      - uploads:/data/uploads
      # Personal themes: read live from this folder, so adding or editing one
      # only needs a browser refresh.
      - ./app/static/themes-local:/app/app/static/themes-local:ro

volumes:
  mysql-data:
  uploads:
